name: Prepare macOS ARM64 native runtime
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-wsl-handoff-20260909]
    paths: [.github/workflows/package-native.yml]
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install native build inputs
        run: |
          test "$(uname -m)" = arm64
          brew install qemu ffmpeg
          qemu-system-aarch64 --version
          ffmpeg -version | head -n 1
      - name: Stage and verify portable signed binaries
        run: |
          cat > native.properties <<EOF
          backend=qemu
          guestArch=arm64
          accel=hvf
          display=vnc
          gpu=virtio
          input=auto
          qemu=$(brew --prefix)/bin/qemu-system-aarch64
          ffmpeg=$(brew --prefix)/bin/ffmpeg
          firmware=$(brew --prefix)/share/qemu/edk2-aarch64-code.fd
          colorOrder=bgr
          width=720
          height=1280
          memory=4096
          cpus=4
          shutdownMethod=power-key
          EOF
          java scripts/StageMacRuntime.java native.properties native-stage --native-only
          native-stage/bin/qemu-system-aarch64 -device help > native-stage/device-help.txt
          grep -q virtio-multitouch-pci native-stage/device-help.txt
          git rev-parse HEAD > native-stage/mod-source-commit.txt
          tar -czf macos-arm64-native-stage.tar.gz -C native-stage .
          shasum -a 256 macos-arm64-native-stage.tar.gz > macos-arm64-native-stage.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-native-stage
          path: macos-arm64-native-stage.tar.gz*
          retention-days: 7
          if-no-files-found: error
