name: Verify portable runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Go product configuration and patch safety (not an Android build)
        run: java android/image/tests/PrepareSelfTest.java
      - name: Compact profile scope and WebView ABI filtering
        run: |
          java android/image/tests/PrepareCompactSelfTest.java
          python3 android/image/tests/test_filter_webview.py
      - name: Check Linux image build script syntax
        run: bash -n android/image/build-go.sh
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: java scripts/Dev.java check
      - name: Reproducible runtime package and cache identity
        run: java scripts/PackageRuntimeSelfTest.java
      - name: Universal runtime package isolation
        run: java scripts/MergeRuntimePackagesSelfTest.java
      - name: Compile and probe IOSurface on macOS
        if: runner.os == 'macOS'
        run: java scripts/Dev.java native-probe
      - name: Core, protocol and owned-process lifecycle
        run: java scripts/Dev.java quick
      - name: Private zstd decoder and local image library on this host
        shell: bash
        run: |
          mkdir -p build/portable-classes/mcandroidphone/runtime
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/github/luben/zstd-jni/1.5.7-16/zstd-jni-1.5.7-16.jar -o build/portable-classes/mcandroidphone/runtime/zstd-codec.jar
          java --enable-native-access=ALL-UNNAMED -cp build/portable-classes com.zhongbai233.mcandroidphone.core.ZstdBundleSelfTest
          java --enable-native-access=ALL-UNNAMED -cp build/portable-classes com.zhongbai233.mcandroidphone.core.AndroidImageLibrarySelfTest
      - name: Linux native environment wire and stale-state checks
        if: runner.os == 'Linux'
        run: |
          mkdir -p android/tools/build
          g++ -std=c++17 -Wall -Wextra -Werror android/image/guest/environmentd.cpp -o android/tools/build/environmentd
          g++ -std=c++17 -Wall -Wextra -Werror android/tools/inspect-state.cpp -o android/tools/build/inspect-state
          java -cp build/portable-classes com.zhongbai233.mcandroidphone.core.EnvironmentNativeSelfTest android/tools/build/environmentd android/tools/build/inspect-state
  legacy-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Legacy external bridge regression
        env:
          PYTHONPATH: bridge
        run: |
          python -m unittest discover -s bridge/tests -q
          python -m unittest discover -s scripts/tests -q
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build mod (retry transient artifact server errors)
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if sh gradlew build --no-daemon 2>&1 | tee build-ci.log; then exit 0; fi
            if ! grep -Eq 'Received status code (429|50[234])|timed out|Connection reset' build-ci.log; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Verify compressed runtime packaging
        run: java scripts/PackageRuntimeXZSelfTest.java build/libs/mcandroidphone-0.2.1-dev.20260913.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mcandroidphone-jar
          path: build/libs/*.jar
          if-no-files-found: error
