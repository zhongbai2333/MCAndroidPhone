plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}
base { archivesName = 'mcandroidphone' }
group = 'com.zhongbai233.mcandroidphone'
version = '0.1.0-prototype'
repositories { mavenCentral() }
// Private resource, not a shared Minecraft dependency or a second runtime installation.
configurations { xzCodec { transitive = false } }
dependencies { xzCodec 'org.tukaani:xz:1.12' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
neoForge {
    enable {
        version = project.neo_version
        // Keep CI on the same tested NeoForm decompilation/recompilation pipeline as local builds.
        disableRecompilation = false
    }
    runs {
        client {
            client()
            if (System.getProperty('os.name').startsWith('Mac')) jvmArgument '-XstartOnFirstThread'
            gameDirectory = rootProject.file('run')
            jvmArgument '--enable-native-access=ALL-UNNAMED,mcandroidphone'
            systemProperty 'mcandroidphone.smokeWarmupSeconds', providers.gradleProperty('phoneSmokeWarmupSeconds').getOrElse('0')
            systemProperty 'mcandroidphone.smoke', providers.gradleProperty('phoneSmoke').getOrElse('false')
            systemProperty 'mcandroidphone.worldSmoke', providers.gradleProperty('phoneWorldSmoke').getOrElse('false')
            systemProperty 'mcandroidphone.patternSmoke', providers.gradleProperty('phonePatternSmoke').getOrElse('false')
            systemProperty 'mcandroidphone.androidSmoke', providers.gradleProperty('phoneAndroidSmoke').getOrElse('false')
            systemProperty 'mcandroidphone.environmentSmoke', providers.gradleProperty('phoneEnvironmentSmoke').getOrElse('false')
            systemProperty 'mcandroidphone.smokeScreenshot', providers.gradleProperty('phoneSmokeScreenshot').getOrElse(rootProject.file('.runtime/android-phone-world-smoke.png').absolutePath)
            if (providers.gradleProperty('bridgeConfig').isPresent()) {
                systemProperty 'mcandroidphone.config', rootProject.file(providers.gradleProperty('bridgeConfig').get()).absolutePath
            }
            systemProperty 'mcandroidphone.runtimeRoot', rootProject.file(providers.gradleProperty('phoneRuntimeRoot').getOrElse('.runtime')).absolutePath
            ['Backend','Gpu','Qemu','Iso','Disk','DiskFormat','DataDisk','DataDiskFormat','FirmwareVars','FirmwareVarsFormat','AdbPort','Kernel','Initrd','Ffmpeg','Angle',
             'Width','Height','Density','Memory','Cpus','Accel','GuestArch','Display','Firmware','KernelAppend','Input','ColorOrder','Bios','Environment','Storage','DiskLayout','ShutdownMethod','QemuData','Camera','CameraTransport'].each { suffix ->
                def value = providers.gradleProperty('phoneRuntime' + suffix)
                if (value.isPresent()) systemProperty 'mcandroidphone.runtime' + suffix, value.get()
            }
        }
    }
    mods {
        mcandroidphone {
            sourceSet sourceSets.main
        }
    }
}
tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Version': project.version)
}
tasks.register('geometrySelfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zhongbai233.mcandroidphone.phone.PhoneGeometrySelfTest'
}
tasks.named('check') { dependsOn geometrySelfTest, 'coreSelfTest' }
tasks.register('environmentSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = files(sourceSets.main.output, sourceSets.test.output)
    mainClass = 'com.zhongbai233.mcandroidphone.core.EnvironmentSelfTest'
}
tasks.named('check') { dependsOn 'environmentSelfTest' }
tasks.register('storageBundleSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = files(sourceSets.main.output, sourceSets.test.output)
    mainClass = 'com.zhongbai233.mcandroidphone.core.StorageBundleSelfTest'
}
tasks.named('check') { dependsOn 'storageBundleSelfTest' }
tasks.register('sharedSystemDiskSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zhongbai233.mcandroidphone.core.SharedSystemDiskSelfTest'
}
tasks.named('check') { dependsOn 'sharedSystemDiskSelfTest' }
tasks.register('qmpShutdownSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = files(sourceSets.main.output, sourceSets.test.output)
    mainClass = 'com.zhongbai233.mcandroidphone.core.QmpShutdownSelfTest'
}
tasks.named('check') { dependsOn 'qmpShutdownSelfTest' }
tasks.register('cameraChannelSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = files(sourceSets.main.output, sourceSets.test.output)
    mainClass = 'com.zhongbai233.mcandroidphone.core.CameraChannelSelfTest'
}
tasks.named('check') { dependsOn 'cameraChannelSelfTest' }
tasks.named('test') { enabled = false }

// Only the small native-process guardian needs a separate JVM. The backend runs in Minecraft.
tasks.register('nativeGuardBundle', Jar) {
    dependsOn compileJava
    archiveFileName = 'native-guard.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/runtime')
    from(tasks.named('compileJava').flatMap { it.destinationDirectory }) {
        include 'com/zhongbai233/mcandroidphone/core/NativeGuard*.class'
        include 'com/zhongbai233/mcandroidphone/core/Json*.class'
    }
}
tasks.named('processResources') {
    dependsOn nativeGuardBundle
    from(configurations.xzCodec) {
        into 'mcandroidphone/runtime'
        rename { 'xz-codec.jar' }
    }
    from(tasks.named('nativeGuardBundle').flatMap { it.archiveFile }) { into 'mcandroidphone/runtime' }
}

tasks.register('runtimeSelfTest', JavaExec) {
    dependsOn testClasses, processResources
    classpath = files(sourceSets.main.output, sourceSets.test.output)
    mainClass = 'com.zhongbai233.mcandroidphone.core.ManagedRuntimeSelfTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args rootProject.file('.runtime').absolutePath
}

tasks.register('coreSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = files(sourceSets.main.output, sourceSets.test.output)
    mainClass = 'com.zhongbai233.mcandroidphone.core.CoreSelfTest'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('runtimeSmoke', JavaExec) {
    dependsOn testClasses, processResources
    classpath = files(sourceSets.main.output, sourceSets.test.output)
    mainClass = 'com.zhongbai233.mcandroidphone.core.RuntimeSmoke'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args rootProject.file('.runtime').absolutePath
    ['backend','qemu','ffmpeg','guestArch','accel','firmware','bios','input','display','gpu','width','height','memory','cpus','iso','disk','dataDisk','dataDiskFormat','firmwareVars','firmwareVarsFormat','adbPort','kernel','initrd','kernelAppend','colorOrder','environment','expectedWidth','expectedHeight','warmupSeconds'].each { key ->
        def value = providers.gradleProperty('runtime.' + key)
        if (value.isPresent()) args key + '=' + value.get()
    }
}

tasks.register('compressedBundleSelfTest', JavaExec) {
    dependsOn testClasses, processResources
    classpath = files(sourceSets.main.output, sourceSets.test.output)
    mainClass = 'com.zhongbai233.mcandroidphone.core.CompressedBundleSelfTest'
}
tasks.named('check') { dependsOn 'compressedBundleSelfTest' }
